[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
# Arc targets the Osaka baseline. Prague bytecode is a strict subset, so no opcode here
# depends on anything newer than what every Arc node already runs (D013).
evm_version = "prague"
optimizer = true
optimizer_runs = 10000

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
arc = "${ARC_RPC_URL}"

[fmt]
line_length = 100

[lint]
# Production code (src/) must lint clean. Tests and scripts are excluded: their casts are
# 3-character literals into bytes3, and the test doubles ignore return values on purpose.
ignore = ["test/**/*.sol", "script/**/*.sol"]
